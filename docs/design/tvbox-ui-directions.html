<div id="tvbox-ui-directions">
  <div class="viz-controls tvx-picker" aria-label="首页设计方向">
    <button type="button" class="btn btn-primary" data-direction="hybrid" aria-pressed="true">影院 · 媒体库（建议）</button>
    <button type="button" class="btn" data-direction="cinema" aria-pressed="false">沉浸影院</button>
    <button type="button" class="btn" data-direction="library" aria-pressed="false">极速媒体库</button>
  </div>
  <section class="tvx-screen" aria-label="TVBox 首页设计方向预览">
    <div id="tvbox-ui-direction-stage"></div>
  </section>
</div>

<script>
(() => {
  const root = document.getElementById('tvbox-ui-directions');
  const stage = document.getElementById('tvbox-ui-direction-stage');
  const directionButtons = Array.from(root.querySelectorAll('[data-direction]'));

  const posterData = [
    ['这一秒过火', '更新至25集', 'tvx-art-2'],
    ['九门 2026', '全网独播', 'tvx-art-3'],
    ['昭阳公主', '更新至15集', 'tvx-art-4'],
    ['警字一号', '更新至16集', 'tvx-art-5'],
    ['天才，女友', '更新至06集', 'tvx-art-6'],
    ['夜语记', '即将开播', 'tvx-art-7'],
    ['江海潮生', '更新至17集', 'tvx-art-8'],
    ['第五立面', '更新至21集', 'tvx-art-3']
  ];

  const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;

  const poster = (item, index, wide = true, focused = false, progress = false) => `
    <button type="button" class="tvx-poster" data-tvx-focusable="true" ${focused ? 'data-demo-focused="true"' : ''} aria-label="${item[0]}，${item[1]}">
      <span class="tvx-poster-art ${item[2]}">
        <span class="tvx-art-title">${item[0]}</span>
        ${progress ? '<span class="tvx-progress"><span></span></span>' : ''}
      </span>
      <span class="tvx-poster-meta">
        <span>${item[0]}</span>
        <span class="text-small tvx-muted">${item[1]} · ${index % 2 === 0 ? '国产剧' : '电影'}</span>
      </span>
    </button>`;

  const filters = (active = '为你推荐') => ['为你推荐', '电影', '电视剧', '动漫', '综艺'].map((label) => `
    <button type="button" class="tvx-filter" data-tvx-focusable="true" aria-pressed="${label === active}">${label}</button>`).join('');

  const utilities = () => `
    <div class="tvx-utility-row">
      <button type="button" class="tvx-icon-button" data-tvx-focusable="true" aria-label="搜索">${icon('search')}<span class="text-small">搜索</span></button>
      <button type="button" class="tvx-icon-button" data-tvx-focusable="true" aria-label="观看历史">${icon('history')}<span class="text-small">历史</span></button>
      <button type="button" class="tvx-icon-button" data-tvx-focusable="true" aria-label="设置">${icon('settings')}<span class="text-small">设置</span></button>
    </div>`;

  const renderHybrid = () => `
    <div class="tvx-layout-hybrid">
      <nav class="tvx-side-rail" aria-label="主导航">
        <span class="tvx-brand-mark">TV</span>
        <button type="button" class="tvx-nav-button" data-tvx-focusable="true" aria-current="page" aria-label="首页">${icon('home')}</button>
        <button type="button" class="tvx-nav-button" data-tvx-focusable="true" aria-label="电视直播">${icon('tv')}</button>
        <button type="button" class="tvx-nav-button" data-tvx-focusable="true" aria-label="平台直播">${icon('radio-tower')}</button>
        <button type="button" class="tvx-nav-button" data-tvx-focusable="true" aria-label="AI 找片">${icon('sparkles')}</button>
        <span class="tvx-nav-spacer"></span>
        <button type="button" class="tvx-nav-button" data-tvx-focusable="true" aria-label="设置">${icon('settings')}</button>
      </nav>
      <main class="tvx-hybrid-content">
        <header class="tvx-topbar">
          <div class="tvx-hybrid-source"><span class="tvx-status-dot"></span><span>量子影视</span><span class="text-small tvx-muted">4479 部</span></div>
          ${utilities()}
        </header>
        <section class="tvx-hybrid-hero" aria-label="推荐影片">
          <div class="tvx-hero-art" aria-hidden="true"></div>
          <div class="tvx-hybrid-copy">
            <span class="tvx-eyebrow text-small">${icon('badge-check')} 今日热播</span>
            <h2>这一秒过火</h2>
            <div class="tvx-meta-line text-small"><span>2026</span><span>·</span><span>国产剧</span><span>·</span><span>更新至25集</span></div>
            <div class="tvx-hero-actions">
              <button type="button" class="tvx-action tvx-action-primary" data-tvx-focusable="true" aria-label="播放这一秒过火">${icon('play')}播放</button>
              <button type="button" class="tvx-action" data-tvx-focusable="true">详情</button>
            </div>
          </div>
        </section>
        <section class="tvx-hybrid-bottom" aria-label="继续观看">
          <div class="tvx-section-title"><span>继续观看</span><span class="text-small tvx-muted">方向键浏览 · OK 播放</span></div>
          <div class="tvx-poster-row">
            ${poster(posterData[0], 0, true, true, true)}
            ${poster(posterData[1], 1, true, false, true)}
            ${poster(posterData[2], 2, true, false, false)}
            ${poster(posterData[3], 3, true, false, false)}
            ${poster(posterData[4], 4, true, false, false)}
          </div>
        </section>
      </main>
    </div>`;

  const renderCinema = () => `
    <main class="tvx-layout-cinema">
      <header class="tvx-topbar">
        <div class="tvx-brand"><span class="tvx-brand-mark">TV</span><span>TVBox</span></div>
        <nav class="tvx-cinema-nav" aria-label="内容导航">${filters('为你推荐')}</nav>
        ${utilities()}
      </header>
      <section class="tvx-cinema-copy" aria-label="焦点推荐">
        <span class="tvx-eyebrow text-small">本周编辑精选</span>
        <h2>这一秒过火</h2>
        <div class="tvx-meta-line text-small"><span>9.1</span><span>·</span><span>国产剧</span><span>·</span><span>2026</span><span>·</span><span>全25集</span></div>
        <p class="tvx-cinema-description text-small">意外重逢牵出一段被时间隐藏的真相。一次选择，改写两个人的余生。</p>
        <div class="tvx-hero-actions">
          <button type="button" class="tvx-action tvx-action-primary" data-tvx-focusable="true" data-demo-focused="true">${icon('play')}立即播放</button>
          <button type="button" class="tvx-action" data-tvx-focusable="true">${icon('plus')}收藏</button>
        </div>
      </section>
      <section class="tvx-cinema-shelf" aria-label="正在热播">
        <div class="tvx-section-title"><span>正在热播</span><span class="text-small tvx-muted">量子影视 · 每日更新</span></div>
        <div class="tvx-poster-row">
          ${poster(posterData[0], 0)}
          ${poster(posterData[1], 1)}
          ${poster(posterData[2], 2)}
          ${poster(posterData[3], 3)}
          ${poster(posterData[4], 4)}
          ${poster(posterData[5], 5)}
        </div>
      </section>
    </main>`;

  const renderLibrary = () => `
    <main class="tvx-layout-library">
      <header class="tvx-library-toolbar">
        <div class="tvx-brand"><span class="tvx-brand-mark">TV</span><span>TVBox</span><span class="text-small tvx-muted">量子 · 4479 部影片</span></div>
        ${utilities()}
      </header>
      <section class="tvx-library-filter-line" aria-label="影片分类">
        <div class="tvx-filter-row">${filters('电视剧')}</div>
        <span class="tvx-density-pill text-small">${icon('layout-grid')} 6 列</span>
      </section>
      <section class="tvx-library-grid" aria-label="影片网格">
        ${poster(posterData[0], 0, false, false)}
        ${poster(posterData[1], 1, false, true)}
        ${poster(posterData[2], 2, false, false)}
        ${poster(posterData[3], 3, false, false)}
        ${poster(posterData[4], 4, false, false)}
        ${poster(posterData[5], 5, false, false)}
      </section>
    </main>`;

  const renderers = { hybrid: renderHybrid, cinema: renderCinema, library: renderLibrary };

  function installProductInteractions() {
    const focusable = Array.from(stage.querySelectorAll('[data-tvx-focusable="true"]'));
    focusable.forEach((element) => {
      element.addEventListener('click', () => {
        focusable.forEach((item) => item.removeAttribute('data-demo-focused'));
        element.setAttribute('data-demo-focused', 'true');
      });
      element.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        const currentIndex = focusable.indexOf(element);
        const delta = event.key === 'ArrowRight' ? 1 : -1;
        const nextIndex = (currentIndex + delta + focusable.length) % focusable.length;
        focusable[nextIndex].focus();
        event.preventDefault();
      });
    });
  }

  function renderIcons(attempt = 0) {
    if (globalThis.lucide) {
      globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    } else if (attempt < 20) {
      setTimeout(() => renderIcons(attempt + 1), 25);
    }
  }

  function render(direction) {
    stage.innerHTML = renderers[direction]();
    directionButtons.forEach((button) => {
      const selected = button.dataset.direction === direction;
      button.setAttribute('aria-pressed', String(selected));
      button.classList.toggle('btn-primary', selected);
    });
    installProductInteractions();
    renderIcons();
  }

  directionButtons.forEach((button) => {
    button.addEventListener('click', () => render(button.dataset.direction));
  });

  render('hybrid');
})();
</script>
